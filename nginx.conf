server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API routes to FastAPI backend
    location ~ ^/(tickets|customers|orders|knowledge|ai|reply|tool-actions|eval-runs|health|docs|redoc|openapi.json)(/|$) {

        proxy_pass https://trustdesk-backend.onrender.com;

        proxy_http_version 1.1;

        # IMPORTANT: HTTPS/SNI configuration for Render
        proxy_ssl_server_name on;
        proxy_ssl_name trustdesk-backend.onrender.com;

        # Backend host
        proxy_set_header Host trustdesk-backend.onrender.com;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect https://trustdesk-backend.onrender.com/ /;

        proxy_read_timeout 120s;
    }
}