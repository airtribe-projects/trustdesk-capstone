services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trustdesk-backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: sqlite:///./data/trustdesk.db
      FORCE_SEED: ${FORCE_SEED:-false}
    volumes:
      - trustdesk-data:/app/backend/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trustdesk-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trustdesk-data:
    driver: local
